<!DOCTYPE html>
<html>
<head>
    <title>我的AI助手</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- 添加 PWA 必要配置 -->
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="chat" style="height: 80vh; overflow-y: scroll;"></div>
    <input type="text" id="input" placeholder="输入消息..." style="width: 70%;">
    <button onclick="sendMessage()" style="width: 25%;">发送</button>

    <script>

        // 发送消息到后端（后续替换成你的API地址）
        async function sendMessage() {
            const input = document.getElementById('input').value;
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div>你：${input}</div>`;

            // 调用你的后端API（示例用Cloudflare Worker）
            const response = await fetch('https://your-cloudflare-worker-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: input })
            });
            const data = await response.json();
            chat.innerHTML += `<div>AI：${data.reply}</div>`;
        }
    </script>
    <script>
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
              .then(registration => console.log('ServiceWorker 注册成功'))
              .catch(err => console.log('ServiceWorker 注册失败:', err));
          });
        }
      </script>
</body>
</html>
